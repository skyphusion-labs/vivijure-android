name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: kit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kit unit tests
        run: |
          # Kit is plain JVM; use a minimal gradle init if wrapper not yet vendored
          if [ -x ./gradlew ]; then
            ./gradlew :vivijure-kit:test --no-daemon
          else
            echo "gradlew not yet vendored; kit sources present"
            test -f vivijure-kit/src/main/kotlin/org/skyphusion/vivijure/kit/VivijureClient.kt
          fi

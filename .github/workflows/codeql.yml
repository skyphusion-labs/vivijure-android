name: CodeQL

# This workflow is the code-scanning analysis source for this repository.
#
# The org `aviation-grade-main-org` ruleset requires a status check named exactly
# `CodeQL`, pinned to integration_id 57789. That context is the code-scanning
# merge-protection check emitted by the `github-advanced-security` app; it is NOT a job
# in this file, and no job here could produce it, because jobs are emitted by GitHub
# Actions under integration_id 15368. What satisfies the context is the EXISTENCE of a
# code-scanning analysis for the head under evaluation, which is what the jobs below
# produce. Shape ported from prism-android/.github/workflows/codeql.yml, the conformant
# Kotlin sibling in this org.
#
# Refs skyphusion-labs/fleet-chezmoi#1612

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CodeQL:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Kotlin (CodeQL)
        if: matrix.language == 'java-kotlin'
        run: ./gradlew :vivijure-kit:compileKotlin --no-daemon
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

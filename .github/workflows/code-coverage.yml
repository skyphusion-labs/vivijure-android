name: code-coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `coverage` is a REQUIRED status check in the org `aviation-grade-main-org` ruleset,
  # matched by STRING against the check-run name, which is this job's `name:`. Shape
  # ported from prism-android/.github/workflows/code-coverage.yml, the conformant
  # Kotlin sibling in this org.
  #
  # STATED RESIDUAL, so it is not mistaken for something it is not: this job runs the
  # `:vivijure-kit` unit suite and does not yet emit a coverage report or enforce a
  # coverage floor. It is the same shape the sibling ships. Turning it into a real
  # measurement needs a JaCoCo block in `vivijure-kit/build.gradle.kts`, which is a
  # build-configuration change and is deliberately not bundled here.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Kit unit tests
        run: ./gradlew :vivijure-kit:test --no-daemon --stacktrace
